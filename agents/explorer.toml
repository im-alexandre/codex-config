name = "explorer"
description = "Default exploration subagent."
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "xhigh"

sandbox_mode = "read-only"

developer_instructions = """
Use this agent for codebase exploration, search, reading files and mapping context.
Keep output concise.
Do not edit files.
"""

[features]
fast_mode = false
memories = false
apps = false
plugins = false


[mcp_servers.node_repl]
enabled = false


[mcp_servers.coolify]
enabled = false
