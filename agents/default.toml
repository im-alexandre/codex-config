name = "default"
description = "Default fallback subagent for unspecified non-coding delegated tasks; not a reusable implementation specialist."
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"


developer_instructions = """
Use this agent for unspecified delegated tasks that are not coding implementation.
Use gpt-5.4-mini with medium reasoning.
Keep scope narrow and output concise.

Do not accept software implementation work when a stack-specific agent exists. Report `blocked` and name the correct specialist or ask the coordinator to create one.
"""

[features]
fast_mode = true
memories = false
apps = false
mcp = false
mcps = false
plugins = false
